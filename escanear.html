<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear Asistencia</title>
    <link rel="stylesheet" href="mystyle.css">
    <link rel="icon" href="logoCJ.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    

    <div class="container text-center">
        <header>
    <div class="logo-container">
        <img src="logoCJ.png" alt="Logo Célula" class="logo-img">
    </div>
</header>
        <h2>Apunta al Código QR</h2>
        <p>Coloca la cámara frente al código provisto este jueves en la célula.</p>
        
        <div id="reader" style="width: 100%; max-width: 350px; margin: 20px auto;"></div>
        
        <a href="panel.html" class="btn btn-secondary">Regresar al Inicio</a>

        <p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-top: 20px;">
            Created with ❤️ by Joyker Quintero
        </p>
    </div>

    <!-- Librería para leer QR con la cámara web del celular -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js"></script>
    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Puedes validar si el texto del QR contiene una palabra clave de tu célula
            if (decodedText.includes("CELULA_JUEVES")) {
                registrarAsistenciaQR();
            } else {
                alert("Código QR no reconocido. Asegúrate de escanear el QR oficial de la célula.");
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>

    
</body>
</html>
</body>
</html>
