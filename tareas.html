<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafíos y Anuncios</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>

    <div class="container" style="max-width: 500px;">
        <header>
            <a href="index.html" class="back-link">⬅️ Volver al Inicio</a>
            <h1>📢 Cartelera y Retos</h1>
            <p>Mantente al día con los anuncios y completa tus desafíos</p>
        </header>

        <!-- Sección de Anuncios Informativos del Líder -->
        <div style="margin-bottom: 24px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--accent-fuego);">🔥 Avisos Importantes</h3>
            <div id="contenedor-anuncios" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Se llena con JS -->
            </div>
        </div>

        <!-- Sección de Tareas / Cuestionarios -->
        <div>
            <h3 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--accent-success);">📝 Desafíos Semanales</h3>
            <div id="contenedor-tareas" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- Se llena con JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderizarAnuncios();
            renderizarTareas();
        });

        function renderizarAnuncios() {
            let anuncios = obtenerAnunciosGlobales();
            let cont = document.getElementById('contenedor-anuncios');
            cont.innerHTML = "";

            anuncios.forEach(an => {
                let card = document.createElement('div');
                card.className = "tarea-card";
                card.style.borderLeft = "4px solid var(--accent-fuego)";
                card.innerHTML = `
                    <h4 style="margin-bottom: 4px; color: var(--text-primary);">${an.titulo}</h4>
                    <p style="margin-bottom: 6px; color: var(--text-secondary);">${an.contenido}</p>
                    <small style="color: var(--text-secondary); font-size: 0.75rem;">📅 ${an.fecha}</small>
                `;
                cont.appendChild(card);
            });
        }

        function renderizarTareas() {
            let usuario = obtenerUsuarioActual();
            let tareas = obtenerTareasGlobales();
            let cont = document.getElementById('contenedor-tareas');
            cont.innerHTML = "";

            if(!usuario) {
                window.location.href = 'login.html';
                return;
            }

            let completadas = usuario.tareasCompletadas || [];

            tareas.forEach(t => {
                let yaEstaHecha = completadas.includes(t.id);
                let card = document.createElement('div');
                card.className = "tarea-card";
                
                let htmlContenido = `
                    <div class="tarea-header">
                        <span class="badge lectura">${t.tipo.toUpperCase()}</span>
                        <span class="puntos-recompensa">+${t.puntos} pts</span>
                    </div>
                    <h3>${t.titulo}</h3>
                    <p>${t.descripcion}</p>
                `;

                if (yaEstaHecha) {
                    htmlContenido += `<button class="btn btn-completado" disabled>✅ Tarea Completada</button>`;
                } else {
                    if (t.tipo === 'seleccion' || t.tipo === 'si_no') {
                        htmlContenido += `<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">`;
                        t.opciones.forEach(op => {
                            htmlContenido += `<label style="font-size: 0.9rem; color: var(--text-primary); cursor: pointer;"><input type="radio" name="pregunta_${t.id}" value="${op}"> ${op}</label>`;
                        });
                        htmlContenido += `</div>`;
                        htmlContenido += `<button class="btn btn-primary" onclick="verificarRespuesta(${t.id}, '${t.tipo}')">Enviar Respuesta</button>`;
                    } else if (t.tipo === 'abierta') {
                        htmlContenido += `
                            <div class="input-group" style="margin-bottom: 12px;">
                                <input type="text" id="resp_${t.id}" placeholder="Escribe tu respuesta aquí...">
                            </div>
                            <button class="btn btn-primary" onclick="verificarRespuesta(${t.id}, '${t.tipo}')">Enviar Respuesta</button>
                        `;
                    }
                }

                card.innerHTML = htmlContenido;
                cont.appendChild(card);
            });
        }

        function verificarRespuesta(idTarea, tipo) {
            let tareas = obtenerTareasGlobales();
            let tarea = tareas.find(t => t.id === idTarea);
            let usuario = obtenerUsuarioActual();
            let db = obtenerBaseDatosLocal();

            let respuestaValida = false;

            if (tipo === 'seleccion' || tipo === 'si_no') {
                let seleccionada = document.querySelector(`input[name="pregunta_${idTarea}"]:checked`);
                if (!seleccionada) {
                    alert("Por favor selecciona una opción.");
                    return;
                }
                if (seleccionada.value.trim().toLowerCase() === tarea.respuestaCorrecta.trim().toLowerCase() || !tarea.respuestaCorrecta) {
                    respuestaValida = true;
                } else {
                    alert("❌ Respuesta incorrecta. ¡Inténtalo de nuevo!");
                    return;
                }
            } else if (tipo === 'abierta') {
                let texto = document.getElementById(`resp_${idTarea}`).value.trim();
                if (!texto) {
                    alert("Escribe una respuesta antes de enviar.");
                    return;
                }
                // Las abiertas siempre se dan por válidas al redactar
                respuestaValida = true;
            }

            if (respuestaValida) {
                alert(`🎉 ¡Excelente! Respuesta correcta. Ganaste +${tarea.puntos} puntos ⭐.`);
                
                // Actualizar usuario local y base de datos global
                if (!usuario.tareasCompletadas) usuario.tareasCompletadas = [];
                usuario.tareasCompletadas.push(tarea.id);
                usuario.puntos = (usuario.puntos || 0) + tarea.puntos;

                // Actualizar sesión activa
                localStorage.setItem('celula_sesion_activa', JSON.stringify(usuario));

                // Actualizar en la BD general de usuarios
                let index = db.findIndex(u => u.id === usuario.id);
                if (index !== -1) {
                    db[index] = usuario;
                    guardarBaseDatosLocal(db);
                }

                renderizarTareas();
            }
        }
    </script>
</body>
</html>
