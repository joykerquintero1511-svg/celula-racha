<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafíos y Anuncios - Célula Juvenil</title>
    <link rel="icon" href="logoCJ.png" type="image/png">
    <link rel="stylesheet" href="mystyle.css">
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 500px;">
        <header>
            <div class="logo-container">
                <img src="logoCJ.png" alt="Logo Célula" class="logo-img">
            </div>
            <a href="panel.html" class="back-link">⬅️ Volver al Inicio</a>
            <h1>📢 Cartelera y Retos</h1>
            <p>Mantente al día con los anuncios y completa tus desafíos</p>
        </header>

        <!-- Sección de Anuncios Informativos del Líder -->
        <div style="margin-bottom: 24px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--accent-fuego);">🔥 Avisos Importantes</h3>
            <div id="contenedor-anuncios" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="color: var(--text-secondary); text-align: center;">Cargando anuncios...</p>
            </div>
        </div>

        <!-- Sección de Tareas / Cuestionarios -->
        <div>
            <h3 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--accent-success);">📝 Desafíos Semanales</h3>
            <div id="contenedor-tareas" style="display: flex; flex-direction: column; gap: 16px;">
                <p style="color: var(--text-secondary); text-align: center;">Cargando desafíos...</p>
            </div>
        </div>

        <!-- Firma Institucional -->
        <footer class="app-footer">
            <p>Desarrollado y Diseñado por <span>Joyker Quintero</span></p>
        </footer>
    </div> <!-- Cierre del container principal -->

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await renderizarAnuncios();
            await renderizarTareas();
        });

        async function renderizarAnuncios() {
            let anuncios = await obtenerAnunciosGlobales();
            let cont = document.getElementById('contenedor-anuncios');
            cont.innerHTML = "";

            if (!anuncios || anuncios.length === 0) {
                cont.innerHTML = "<p style='color: var(--text-secondary); text-align: center;'>No hay anuncios publicados por ahora.</p>";
                return;
            }

            anuncios.forEach(an => {
                let card = document.createElement('div');
                card.className = "tarea-card";
                card.style.borderLeft = "4px solid var(--accent-fuego)";
                card.innerHTML = `
                    <h4 style="margin-bottom: 4px; color: var(--text-primary);">${an.titulo}</h4>
                    <p style="margin-bottom: 6px; color: var(--text-secondary);">${an.contenido}</p>
                    <small style="color: var(--text-secondary); font-size: 0.75rem;">📅 ${an.fecha || ''}</small>
                `;
                cont.appendChild(card);
            });
        }

        async function renderizarTareas() {
            let usuario = obtenerUsuarioActual();
            let cont = document.getElementById('contenedor-tareas');
            cont.innerHTML = "";

            if(!usuario) {
                window.location.href = 'index.html';
                return;
            }

            let tareas = await obtenerTareasGlobales();

            if (!tareas || tareas.length === 0) {
                cont.innerHTML = "<p style='color: var(--text-secondary); text-align: center;'>No hay desafíos activos en este momento.</p>";
                return;
            }

            let completadas = usuario.tareasCompletadas || [];

            tareas.forEach(t => {
                let yaEstaHecha = completadas.includes(t.id);
                let card = document.createElement('div');
                card.className = "tarea-card";
                
                let tipoStr = (t.tipo || 'lectura').toUpperCase();
                let htmlContenido = `
                    <div class="tarea-header">
                        <span class="badge lectura">${tipoStr}</span>
                        <span class="puntos-recompensa">+${t.puntos || 20} pts</span>
                    </div>
                    <h3>${t.titulo}</h3>
                    <p>${t.descripcion}</p>
                `;

                if (yaEstaHecha) {
                    htmlContenido += `<button class="btn btn-completado" disabled>✅ Tarea Completada</button>`;
                } else {
                    if (t.tipo === 'seleccion' || t.tipo === 'si_no') {
                        htmlContenido += `<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">`;
                        if (t.opciones && Array.isArray(t.opciones)) {
                            t.opciones.forEach(op => {
                                htmlContenido += `<label style="font-size: 0.9rem; color: var(--text-primary); cursor: pointer;"><input type="radio" name="pregunta_${t.id}" value="${op}"> ${op}</label>`;
                            });
                        }
                        htmlContenido += `</div>`;
                        htmlContenido += `<button class="btn btn-primary" onclick="verificarRespuesta(${t.id}, '${t.tipo}')">Enviar Respuesta</button>`;
                    } else {
                        htmlContenido += `
                            <div class="input-group" style="margin-bottom: 12px;">
                                <input type="text" id="resp_${t.id}" placeholder="Escribe tu respuesta aquí...">
                            </div>
                            <button class="btn btn-primary" onclick="verificarRespuesta(${t.id}, '${t.tipo}')">Enviar Respuesta</button>
                        `;
                    }
                }

                card.innerHTML = htmlContenido;
                cont.appendChild(card);
            });
        }

        async function verificarRespuesta(idTarea, tipo) {
            let tareas = await obtenerTareasGlobales();
            let tarea = tareas.find(t => t.id === idTarea);
            let usuario = obtenerUsuarioActual();

            let respuestaValida = false;
            let respuestaCorrectaBD = tarea.respuesta_correcta || tarea.respuestaCorrecta;

            if (tipo === 'seleccion' || tipo === 'si_no') {
                let seleccionada = document.querySelector(`input[name="pregunta_${idTarea}"]:checked`);
                if (!seleccionada) {
                    alert("Por favor selecciona una opción.");
                    return;
                }
                if (!respuestaCorrectaBD || seleccionada.value.trim().toLowerCase() === respuestaCorrectaBD.trim().toLowerCase()) {
                    respuestaValida = true;
                } else {
                    alert("❌ Respuesta incorrecta. ¡Inténtalo de nuevo!");
                    return;
                }
            } else {
                let texto = document.getElementById(`resp_${idTarea}`).value.trim();
                if (!texto) {
                    alert("Escribe una respuesta antes de enviar.");
                    return;
                }
                respuestaValida = true;
            }

            if (respuestaValida) {
                alert(`🎉 ¡Excelente! Respuesta correcta. Ganaste +${tarea.puntos || 20} puntos ⭐.`);
                
                if (!usuario.tareasCompletadas) usuario.tareasCompletadas = [];
                usuario.tareasCompletadas.push(tarea.id);
                usuario.puntos = (usuario.puntos || 0) + (tarea.puntos || 20);

                localStorage.setItem('celula_sesion_activa', JSON.stringify(usuario));

                // Actualizar en la base de datos de Supabase si el cliente está activo
                if (db) {
                    await db.from('usuarios').update({
                        puntos: usuario.puntos,
                        tareasCompletadas: usuario.tareasCompletadas
                    }).eq('id', usuario.id);
                }

                renderizarTareas();
            }
        }
    </script>
</body>
</html>
