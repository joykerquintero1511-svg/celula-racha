<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Líder - Célula</title>
    <link rel="stylesheet" href="mystyle.css">
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 650px;">
        <header>
            <a href="login.html" class="back-link">⬅️ Cerrar Panel</a>
            <h1>⚙️ Panel de Administración</h1>
            <p>Control total de la célula en tiempo real</p>
        </header>

        <!-- Autenticación de Líder -->
        <div id="admin-auth" style="text-align: center; padding: 20px 0;">
            <p style="margin-bottom: 10px;">Ingresa la contraseña de líder:</p>
            <input type="password" id="admin-pass" placeholder="Contraseña" style="padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: white; width: 80%; margin-bottom: 10px;">
            <br>
            <button class="btn btn-primary" onclick="verificarAdmin()" style="width: 80%; margin: auto;">Entrar al Panel</button>
        </div>

        <!-- Contenido Completo del Panel -->
        <div id="admin-panel" style="display: none;">
            
            <div class="tab-menu" style="margin-bottom: 20px;">
                <button class="tab-btn active" onclick="cambiarTabAdmin('jovenes')">Jóvenes Registrados</button>
            </div>

            <!-- SECCIÓN: JÓVENES -->
            <div id="sec-jovenes" class="admin-seccion">
                <h3>Aprobación de Miembros (Nube)</h3>
                <div id="lista-solicitudes" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                    <p style="color: var(--text-secondary); text-align: center;">Cargando solicitudes...</p>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const CLAVE_LIDER = "celula2026"; // Tu clave de líder

        function verificarAdmin() {
            let pass = document.getElementById('admin-pass').value;
            if(pass === CLAVE_LIDER) {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                cargarSolicitudesNube();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        async function cargarSolicitudesNube() {
            let contenedor = document.getElementById('lista-solicitudes');
            contenedor.innerHTML = "<p style='text-align: center; color: var(--text-secondary);'>Consultando base de datos...</p>";

            const { data, error } = await supabase.from('usuarios').select('*').order('id', { ascending: false });

            if (error) {
                contenedor.innerHTML = "<p style='text-align: center; color: red;'>Error al cargar los usuarios de la nube.</p>";
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                contenedor.innerHTML = "<p style='text-align: center; color: var(--text-secondary);'>No hay jóvenes registrados todavía.</p>";
                return;
            }

            contenedor.innerHTML = "";
            data.forEach((user) => {
                let card = document.createElement('div');
                card.className = "tarea-card";
                card.innerHTML = `
                    <div class="tarea-header">
                        <h3>${user.nombre}</h3>
                        <span class="badge ${user.aprobado ? 'memorizar' : 'lectura'}">${user.aprobado ? '✅ Aprobado' : '⏳ Pendiente'}</span>
                    </div>
                    <p>📱 Teléfono: ${user.telefono} | 🔥 Racha: ${user.racha_actual} semanas</p>
                    ${!user.aprobado 
                        ? `<button class="btn btn-primary" style="padding: 8px; font-size: 0.85rem;" onclick="cambiarEstadoUsuario(${user.id}, true)">Aprobar Acceso</button>` 
                        : `<button class="btn btn-secondary" style="padding: 8px; font-size: 0.85rem;" onclick="cambiarEstadoUsuario(${user.id}, false)">Desactivar</button>`}
                `;
                contenedor.appendChild(card);
            });
        }

        async function cambiarEstadoUsuario(idUsuario, nuevoEstado) {
            const { error } = await supabase
                .from('usuarios')
                .update({ aprobado: nuevoEstado })
                .eq('id', idUsuario);

            if (error) {
                alert("Error al actualizar el estado: " + error.message);
            } else {
                cargarSolicitudesNube(); // Recargar la lista al instante
            }
        }
    </script>
</body>
</html>
