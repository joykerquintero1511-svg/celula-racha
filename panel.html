<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Célula Juvenil - Racha</title>
    <link rel="stylesheet" href="mystyle.css">
    <link rel="icon" href="logoCJ.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logoCJ.png" alt="Logo Célula" class="logo-img">
            </div>
            <h1>🔥 Célula Juvenil</h1>
            <p id="saludo">¡Mantén encendido el fuego de la palabra!</p>
        </header>

        <!-- Tarjeta de Racha Estilo Duolingo -->
        <div class="racha-card">
            <div class="fuego-animado">🔥</div>
            <div class="racha-info">
                <h2 id="num-racha">0</h2>
                <p>Semanas Consecutivas</p>
            </div>
        </div>

        <!-- Estado de Escudos y Récord -->
        <div class="stats-grid">
            <div class="stat-box">
                <span>🛡️ Puntos</span>
                <b id="num-puntos">0</b>
            </div>
            <div class="stat-box">
                <span>🏆 Récord</span>
                <b id="num-record">0</b>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="menu-acciones">
            <a href="escanear.html" class="btn btn-primary">📸 Escanear QR de Hoy</a>
            <a href="tareas.html" class="btn btn-secondary">📝 Tareas y Retos Semanales</a>
            <button class="btn btn-secondary" onclick="cerrarSesion()" style="background: #c0392b; margin-top: 10px; color: white;">🚪 Cerrar Sesión</button>
        </div>

        <!-- Firma Institucional -->
        <footer class="app-footer">
            <p>Desarrollado y Diseñado por <span>Joyker Quintero</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // Cargar datos dinámicos en la interfaz al abrir de forma segura
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = obtenerUsuarioActual();
            
            if (!usuario) {
                window.location.href = 'index.html';
                return;
            }

            // Pintamos los valores reales del usuario en pantalla
            document.getElementById('num-racha').innerText = usuario.racha_actual || 0;
            document.getElementById('num-puntos').innerText = usuario.puntos || 0;
            document.getElementById('num-record').innerText = usuario.racha_maxima || usuario.racha_actual || 0;
            
            // Personalizamos el saludo con su nombre si está disponible
            if(usuario.nombre) {
                document.getElementById('saludo').innerText = `¡Hola, ${usuario.nombre}! Mantén encendido el fuego.`;
            }
        });
    </script>
</body>
</html>
